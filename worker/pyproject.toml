[project]
name = "mtl-pipeline"
version = "0.1.0"
description = "Pipeline 2 giai đoạn dịch manhwa KO → VI: detect, mask chữ, inpaint, OCR/dịch qua LLM, typeset"
requires-python = ">=3.12,<3.13"
dependencies = [
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "fonttools>=4.55",
    "jsonschema>=4.23",
]

[project.scripts]
mtl = "mtl_pipeline.cli:main"
mtl-worker = "mtl_worker.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "httpx2>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtl_pipeline", "mtl_worker"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["mtl_pipeline/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Độ dài dòng code do `ruff format` lo; comment/docstring tiếng Việt được phép dài hơn.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["mtl_pipeline/vendor/"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "mtl_pipeline.vendor.*"
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
