# Dev stack: Postgres 17 + MinIO (private bucket) + Caddy giả lập "domain riêng" cho file người dùng.
# Trình duyệt chỉ chạm MinIO qua files-proxy (FILES_DOMAIN, mặc định localhost:9100) — proxy thêm nosniff.
name: mtl-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mtl
      POSTGRES_PASSWORD: mtl
      POSTGRES_DB: mtl
    ports:
      - "127.0.0.1:${PG_PORT:-5442}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtl -d mtl"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mtl-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mtl-dev-secret}
      # SPA dev (5180) + SPA e2e (5181, apps/web/e2e/env.ts) — e2e chạy song song được với `pnpm dev`.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:5180},${E2E_WEB_ORIGIN:-http://localhost:5181}
      # alias "local" cho healthcheck `mc ready local`
      MC_HOST_local: http://${S3_ACCESS_KEY:-mtl-dev}:${S3_SECRET_KEY:-mtl-dev-secret}@localhost:9000
    ports:
      # Endpoint nội bộ cho API (HEAD, đọc magic bytes); không đưa cho trình duyệt.
      - "127.0.0.1:${MINIO_PORT:-9200}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9201}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    # Image minio (bản build cộng đồng pgsty, MinIO ngừng phát hành image chính thức) đã kèm mc.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mtl-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mtl-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-mtl}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        # File export (tag mtl-kind=export, packages/shared EXPORT_OBJECT_TAG) tự xoá sau 7 ngày. import = thay cả
        # cấu hình lifecycle → chạy lại nhiều lần vẫn ra đúng 1 rule.
        echo '{"Rules":[{"ID":"expire-exports","Status":"Enabled","Filter":{"Tag":{"Key":"mtl-kind","Value":"export"}},"Expiration":{"Days":7}}]}' \
          | mc ilm import "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready (private, exports expire after 7 days)"

  files-proxy:
    image: caddy:2
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FILES_PORT:-9100}:9100"
    volumes:
      - ./files-proxy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pg-data:
  minio-data:
