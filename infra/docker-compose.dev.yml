# Dev stack: Postgres 17. File người dùng lưu trên đĩa (FILES_DIR, mặc định `<gốc repo>/.data/files`) do API phục vụ.
name: mtl-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mtl
      POSTGRES_PASSWORD: mtl
      POSTGRES_DB: mtl
    ports:
      - "127.0.0.1:${PG_PORT:-5442}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtl -d mtl"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pg-data:
