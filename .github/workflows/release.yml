# Build + đẩy image self-host lên GHCR khi push tag v* (vd v1.2.3 → :1.2.3, :1.2, :latest).
# Image: ghcr.io/<owner>/mtl (app + jobs), ghcr.io/<owner>/mtl-worker. Xem docs/self-host.md.
# Lần đầu push: package GHCR mặc định private — owner đặt public trên GitHub thì người dùng mới pull không cần login.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mtl
            dockerfile: infra/docker/app.Dockerfile
          - name: mtl-worker
            dockerfile: infra/docker/worker.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # latest=auto (mặc định): chỉ tag semver không phải prerelease mới trỏ :latest (v1.3.0-rc.1 thì không;
          # tag không phải semver không ra image). Hotfix dòng cũ (vd v1.1.5 khi đã có v1.2.x) VẪN trỏ :latest →
          # người dùng `pull` bị hạ cấp trên DB đã migrate: chỉ tag hotfix trên dòng mới nhất.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
