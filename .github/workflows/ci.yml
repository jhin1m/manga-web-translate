name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Start Postgres + MinIO (+ files proxy)
        run: pnpm infra:up
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Parity Konva ↔ render.py (bbox mực từng dòng ≤ 1px so fixture render.py đã commit)
        run: |
          pnpm --filter @mtl/web exec playwright install --with-deps chromium
          pnpm --filter @mtl/web e2e typeset-parity
      - name: Infra logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.dev.yml logs --tail 100
