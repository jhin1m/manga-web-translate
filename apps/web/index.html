<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTL</title>
    <style>
      :root { color-scheme: light; --fg: #1a1a1a; --muted: #6b6b6b; --line: #d9d9d9; --accent: #1f4fd1; --danger: #b42318; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: #fff; }
      main { max-width: 420px; margin: 64px auto; padding: 0 16px; }
      h1 { font-size: 20px; margin: 0 0 16px; }
      label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
      input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
      button { margin-top: 16px; padding: 8px 14px; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 4px; font: inherit; cursor: pointer; }
      button.link { background: none; border: none; color: var(--accent); padding: 0; margin: 0; }
      button:disabled { opacity: .6; cursor: default; }
      .error { color: var(--danger); margin-top: 12px; }
      .muted { color: var(--muted); }
      ul.plain { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
      ul.plain li { border-bottom: 1px solid var(--line); padding: 10px 0; }
      a { color: var(--accent); }
      header.bar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
